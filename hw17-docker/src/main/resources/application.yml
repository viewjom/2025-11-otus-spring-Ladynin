spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/db
    username: postgres
    password: postgres
  messages:
    encoding: UTF-8
  sql:
    init:
      mode: always
      data-locations:
        classpath: data.sql
      schema-locations:
        classpath: schema.sql
  jpa:
    open-in-view: false
    generate-ddl: false
    hibernate:
      ddl-auto: none
    show-sql: true